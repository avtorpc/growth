name: growth
services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  backend:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    environment:
      APP_ENV: dev
      APP_DEBUG: '1'
      APP_SECRET: ${APP_SECRET:-local-development-secret}
      DATABASE_HOST: database
      DATABASE_PORT: '3306'
      DATABASE_NAME: ${MYSQL_DATABASE:-growth}
      DATABASE_USER: ${MYSQL_USER:-growth}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-growth_local_password}
    volumes:
      - ../backend/src:/app/src
      - ../backend/config:/app/config
      - ../backend/public:/app/public
      - ../backend/migrations:/app/migrations
      - ../backend/tests:/app/tests:ro
      - ../backend/phpunit.xml.dist:/app/phpunit.xml.dist:ro
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    volumes:
      - ../frontend/src:/app/src
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4200').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  database:
    image: mysql:8.0
    command: ['--default-time-zone=+00:00']
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-growth}
      MYSQL_USER: ${MYSQL_USER:-growth}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-growth_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  mysql_data:
